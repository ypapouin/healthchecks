{% if dependency.state == "waiting" %}
<span class="alert-waiting" role="img"
      aria-label="Waiting for {% for blocker in dependency.blockers %}{{ blocker.name }}{% if not forloop.last %}, {% endif %}{% empty %}parent verification{% endfor %}"
      title="Waiting for {% for blocker in dependency.blockers %}{{ blocker.name }}{% if not forloop.last %}, {% endif %}{% empty %}parent verification{% endfor %}"></span>
{% elif dependency.state == "resuming" %}
<span class="alert-resuming ic-timer" role="img" data-deadline="{{ dependency.notification_after }}"
      aria-label="Recovery grace until {{ dependency.notification_after }}"
      title="Recovery grace until {{ dependency.notification_after }}"></span>
{% elif dependency.state == "claimed" %}
<span class="checks-subline alert-claimed" role="img" aria-label="Alert claimed for delivery" title="Alert claimed for delivery"></span>
{% elif dependency.state == "cancelled" %}
<span class="checks-subline">Alert cancelled</span>
{% endif %}
